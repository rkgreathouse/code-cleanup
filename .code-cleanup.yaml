profile: cli

# examples/ holds code as written before cleaning; tests compare it, the repo check skips
# it. docs/java-style/example is a service checked on its own (profile: service).
exclude:
  - .git
  - .venv
  - venv
  - node_modules
  - __pycache__
  - build
  - dist
  - target
  - .gradle
  - .idea
  - examples
  - example
