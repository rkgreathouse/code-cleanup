# The house style. A project overrides any key from .code-cleanup.yaml at its root:
# mappings merge key by key, lists and values replace.

# none: file rules only. cli: also the python-style layout (package per tool,
# __main__.py entry module, errors.py, tests mirroring modules). service: also the
# java-style Spring REST layout (Maven layout, Application entry class, errors
# package with a @RestControllerAdvice, tests mirroring classes, JSON logs).
profile: none

exclude:
  - .git
  - .venv
  - venv
  - node_modules
  - __pycache__
  - build
  - dist
  - target
  - .gradle
  - .idea

file_length:
  warn: 350
  max: 400

# google-java-format formats (2-space indent, 100 columns, no options); then the
# blank-line rules, our checks, and over the whole project Checkstyle and Error Prone.
java:
  # the project's pom.xml (maven.compiler.release, java.version) wins over this
  release: 21

  # Maven coordinates, resolved once through Maven and cached in ~/.cache/code-cleanup
  tools:
    google-java-format: com.google.googlejavaformat:google-java-format:2.0.0
    checkstyle: com.puppycrawl.tools:checkstyle:14.4.0
    error-prone: com.google.errorprone:error_prone_core:2.52.0

  spacing:
    around_blocks: true
    before_block_comment: true
    before_catch: true

  checks:
    allow_javadoc: false
    allow_environment: false
    simple_streams: true
    max_class_constants: 2
    max_nesting: 4

  # loggers are private static final Logger log = LoggerFactory.getLogger(This.class)
  logging:
    check: true

  # Compiles each Maven module's cleaned sources with its own classpath, from
  # mvn dependency:build-classpath. Severities: "OFF", "WARN", "ERROR" (quoted: YAML
  # reads a bare OFF as false).
  error_prone:
    enabled: true
    checks:
      PatternMatchingInstanceof: "WARN"

  # Rendered to a checkstyle.xml; a module with no settings uses Checkstyle's defaults.
  checkstyle:
    checker:
      LineLength:
        max: 100
        ignorePattern: "^(package|import) "
    tree_walker:
      CyclomaticComplexity:
        max: 10
        switchBlockAsSingleDecisionPoint: true
      AvoidStarImport:
      IllegalCatch:
      EmptyCatchBlock:
      ConstantName:
        format: "^log$|^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$"
      TypeName:
      MethodName:
      MemberName:
      ParameterName:
      LocalVariableName:
      NeedBraces:
      EqualsHashCode:
      MissingSwitchDefault:
      MultipleVariableDeclarations:
      OneStatementPerLine:
      InnerAssignment:
      SimplifyBooleanExpression:
      SimplifyBooleanReturn:
      ModifiedControlVariable:
      VisibilityModifier:
      Regexp:
        format: "System\\.(out|err)\\."
        illegalPattern: true
        message: "prints to System.out or System.err; log through the class logger"

# .gitignore and .dockerignore: blocks of patterns, each under a # comment
ignore:
  sort_blocks: true
  require_headers: true

# taplo formats; then a blank line goes above every [table] and its comments
toml:
  blank_line_before_tables: true
  taplo:
    indent_string: "    "
    column_width: 88
    allowed_blank_lines: 1

python:
  spacing:
    around_blocks: true
    before_block_comment: true
    before_except: true
    tight_else: true

  checks:
    relative_imports: true
    allow_docstrings: false
    allow_environment: false
    simple_comprehensions: true
    suggest_walrus: true
    max_module_constants: 2

  # basicConfig only in __main__.py, with this format; loggers named for their module
  logging:
    check: true
    format: "%(asctime)s %(levelname)s %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  # Runs once over the cleaned files, after ruff; uses ROOT/.venv for third-party
  # packages when it exists.
  mypy:
    enabled: true
    config:
      strict: true
      python_version: "3.14"

  # Written to a generated ruff.toml passed with --config, so a project's own ruff
  # settings never change the result.
  ruff:
    target-version: py314
    line-length: 88
    lint.preview: true
    lint.explicit-preview-rules: true
    lint.select:
      [E, W, F, I, N, UP, B, SIM, PTH, RET, ANN, T20, TID, C90, ERA, G, LOG, C4, PERF401, PERF403, PLW0603, PLR1702]
    lint.ignore: [TID252]
    lint.mccabe.max-complexity: 10
    lint.pylint.max-nested-blocks: 4
    lint.flake8-tidy-imports.banned-api:
      argparse:
        msg: Only the entry module (__main__.py) parses arguments.
    lint.per-file-ignores:
      "**/__main__.py": [T201, TID251]
